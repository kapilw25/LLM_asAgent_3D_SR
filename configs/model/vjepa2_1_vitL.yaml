# V-JEPA 2.1 ViT-L (300M, 1024-dim) — SCALE-AXIS ablation backbone (small)
#
# Clone of vjepa2_1.yaml with ViT-L dims. iter17: the 2.1 ViT-L release is DISTILLED from
# ViT-G (vjepa2_1_vitl_dist_vitG_384.pt) → likely FROZEN-ONLY (a distilled encoder carries no
# JEPA predictor; confirm before any run_train). Frozen-eval PASSED 290/292 via registry arch.
# ── VERIFY DIMS (eyeball) ──────────────────────────────────────────────────────────────
#  encoder ctor (def vit_large): https://github.com/facebookresearch/vjepa2/blob/main/src/models/vision_transformer.py
#    → embed_dim=1024 · depth=24 · num_heads=16 · mlp_ratio=4.0
#  checkpoint (filename): https://github.com/facebookresearch/vjepa2#models  (vjepa2_1_vitl_dist_vitG_384.pt)

model:
  version: "2.1"
  arch: vit_large                # dispatched in get_vit_by_arch; frozen-eval validated (290/292)
  embed_dim: 1024                # VERIFIED (frozen load 290/292)
  depth: 24                      # VERIFIED
  num_heads: 16                  # VERIFIED (1024/64)
  mlp_ratio: 4.0                 # VERIFIED: vit_large base ctor default loaded clean

  # Predictor — VERIFY all four against the 2.1 ViT-L release (carried from ViT-G as a placeholder;
  # only used for TRAINING the variant, not frozen-eval).
  pred_depth: 24                 # VERIFY
  pred_embed_dim: 384            # VERIFY
  pred_num_heads: 12             # VERIFY
  num_mask_tokens: 2
  zero_init_mask_tokens: true

  # Deep supervision — same count as 2.1 ViT-G; layers derived from depth in code
  # (depth=24 → [5, 11, 17, 23], the depth/4-spaced analog of [11,23,37,47] @ depth=48).
  n_output_distillation: 4

  use_rope: true
  use_activation_checkpointing: true

  loss_exp: 1.0
  predict_all: true
  weight_distance_loss: true

  crop_size: 384
  patch_size: 16
  tubelet_size: 2

  # Checkpoint — distilled-from-G (downloaded HTTP 200, 4.8G)
  hf_model_id: null
  checkpoint_url: https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitl_dist_vitG_384.pt
  checkpoint_path: checkpoints/vjepa2_1_vitl_dist_vitG_384.pt
  min_student_load_pct: 90
  min_predictor_load_pct: 50
