# ═════════════════════════════════════════════════════════════════════════
# iter16 (2026-05-20) — hardcoded-value migration per CLAUDE.md
# "No hardcoded values in Python — YAML or runtime discovery only".
# All blocks below were previously module-level constants or argparse defaults
# in src/*.py — now centralised here as single source of truth. Consumer code
# reads via cfg[key] (FAIL LOUD on missing; never `.get(key, default)`).
# ═════════════════════════════════════════════════════════════════════════

# -- Train / val / test split ratio (canonical rule — used by probe_action,
# probe_train_subset, and every script that partitions a clip pool).
# Flat (mode-invariant) per CLAUDE.md POC↔FULL parity: only N_clips and
# max_epochs may differ between SANITY/POC/FULL. Same ratios everywhere else.
# iter16 (2026-05-20): single source of truth for the split — m00f ultra_hard
# (with its asymmetric 80/10/10 split) retired to src/legacy/ same day.
probe_split:
  # iter16 (2026-05-21): mode-keyed train/val/test split ratios.
  # POC↔FULL parity-locked (paper recipe — tight val for trajectory
  # plots). SANITY uses laxer 60/20/20 because M5 video-disjoint SGKF needs
  # n_splits ≤ min_videos_per_class — at SANITY scale (~100 clips × 11 classes
  # × ~14 clips/video ≈ 5 videos/class), k_val=16 from val_pct=0.05 is
  # infeasible. SANITY only validates code paths, not paper-grade splits, so
  # laxer ratios are appropriate (CLAUDE.md POC↔FULL parity rule applies to
  # POC↔FULL — NOT to SANITY).
  sanity:
    train_pct: 0.60
    val_pct:   0.20      # test_pct = 0.20; k_val = 4 — fits ~5 videos/class
  poc:
    train_pct: 0.75      # paper-locked (cross-recipe parity with FULL)
    val_pct:   0.05      # test_pct = 0.20; k_val = 16 — needs ≥16 vids/class
  full:
    train_pct: 0.75
    val_pct:   0.05

# iter16 M1 (2026-05-21): mode-keyed FRACTION of FULL corpus. N_full read at
# runtime from data/full_local/full_local.json (or args.eval_subset for older
# manifests). All POC/SANITY clip counts are derived; NO hardcoded literals
# anywhere in src/*.py.
clip_pool_ratio:
  full:   1.00      # 100% — every clip in the master manifest
  poc:    1.00      # iter17 (2026-05-26): 0.10→1.00 — POC now uses ALL ~9,960 eval_10k_local
                    # clips at 2 ep / 2 ckpts (v15a-style full-eval_10k run, not a 10% subset).
                    # REVERT TO 0.10 when local_data_dir switches to full_local (115k) so POC
                    # stays a ~11,500-clip proxy instead of the full 115k corpus.
  sanity: 0.01      # 1%   → ~ 1,150 @ N_full = 115,000

# ── Surgery init source (iter17 2026-05-26) ──────────────────────────────
# Each m09c surgery variant (DI/noDI x encoder/head) inits its encoder+predictor
# from the LOCAL m09a pretrain_encoder output for the SAME run-mode — NOT a remote
# hf:// ckpt. A remote base of unknown provenance is a paired-Δ confound; surgery
# must build on the exact local pretrain it is compared against, per mode. SINGLE
# SOURCE: run_train.sh composes BOTH the m09a write-dir (OUT_DIR) AND the surgery
# read-path from `pretrain_namespace`, so they can never drift (SHARED DERIVATION,
# src/CLAUDE.md). Resolves per mode to:
#   outputs/{sanity|poc|full}/<pretrain_namespace>/<ckpt_filename>
surgery_init:
  pretrain_namespace: m09a_pretrain_encoder   # local dir under outputs/<mode>/ (m09a writes here)
  ckpt_filename:      m09a_ckpt_best.pt        # combined student+predictor+teacher (schema="student")

# iter16 M8 / R4 (2026-05-21): torch.compile gate for m04d RAFT-Large.
#
# WebSearch-validated recipe (NOT the speculative "same as M7" copy from
# the original plan draft):
#   • mode="default"  — NO cudagraphs → no 70 GB CUDA Graph Trees workspace
#                        (PyTorch #120733 + iter13 m04d:225-235 evidence)
#   • dynamic=False   — static shapes; each unique batch size recompiles
#                        fresh (~30-60 s × 4-5 sizes = ~3-5 min one-time
#                        per run). Avoids the CantSplit dynamic-shape bug
#                        (PyTorch #105279, #176653) that crashed iter13.
#   • fullgraph=False — tolerate graph breaks at non-tensor ops.
#
# AdaptiveBatchSizer interaction (the original iter13 crash trigger):
# with mode="default" + dynamic=False, batch-size shrinks just trigger a
# fresh compile for the new size, NOT a CantSplit crash. The 70 GB cudagraphs
# memory pool is eliminated, so Pro 4000 (24 GB) fits comfortably.
#
# Cost vs eager: ~1.5-2× faster RAFT inference (compile amortizes after the
# first ~3-5 min of per-shape compiles). m04d Stage-2 wall on Pro 6000:
# ~8 hr → ~3-4 hr. Acceptable per iter13 design — m04d is one-shot per dataset.
#
# FAIL LOUD: if compile raises Inductor errors on warmup, the script MUST exit
# non-zero. No try/except eager-fallback. The operator either fixes the bug
# upstream or sets m04d_compile.enabled=false in this yaml.
m04d_compile:
  enabled:        true              # iter16 (was iter13-disabled). WebSearch-validated.
  mode:           "default"         # NOT reduce-overhead — saves ~70 GB cudagraphs pool
  dynamic:        false             # NON-NEGOTIABLE — iter13 CantSplit root cause was dynamic=True
  fullgraph:      false             # tolerate graph breaks at non-tensor ops
  min_vram_gb:    16                # iter18 (2026-06-20): auto-EAGER below this — Inductor's ~7.65 GB pad_mm compile workspace OOMs an 8 GB GPU (2060 SUPER); 24 GB+ boxes (Pro 4000/5000/6000) still compile

# iter16 M7 / R5 (2026-05-21): torch.compile gate for Grounding DINO.
#
# Default OFF — flip to true after Stage 3 migrates to Pro 6000 96 GB box.
# Recipe inherits M8's WebSearch-validated lessons:
#   • mode="default"  — NOT reduce-overhead (avoid 70 GB cudagraphs pool).
#                        Smaller VRAM footprint; compile cost still ~30-60 s.
#   • dynamic=False   — fixed pixel_values shape (M6 batched uses (4,H,W,3)
#                        with constant H,W). Avoids CantSplit-class bugs.
#                        Compound_prompt is identical across batch (HF #32206).
#   • fullgraph=False — tolerate graph breaks at non-tensor ops.
#
# Expected gain on Pro 6000: ~1.3-1.5× DINO speedup atop M6's 4-anchor
# batching gain. Pro 4000 default OFF — m10 batch size per worker is small,
# compile overhead may not amortize. Operator flips after Pro 6000 migration.
#
# FAIL LOUD on Inductor errors per CLAUDE.md "No CPU/eager fallback in
# inference scripts" — operator either fixes upstream or sets enabled=false.
dino_compile:
  enabled:        true              # Pro 6000 — flip to true on Pro 6000
  mode:           "default"         # NOT reduce-overhead — same M8 lesson re cudagraphs pool
  dynamic:        false             # fixed pixel_values shape — HF #34556
  fullgraph:      false             # tolerate graph breaks at non-tensor ops

# -- probe_action labels bootstrap (iter14 recipe-v3, 2026-05-09) --
# Read by src/probe_action.py (CLI via get_pipeline_config()) AND by
# src/utils/probe_labels.ensure_probe_labels_for_mode() (in-process via merged
# cfg). iter16 M9 followup (2026-05-21): MOVED from base_optimization.yaml to
# pipeline.yaml so the CLI path sees the same values as the in-process path
# (probe_action.py CLI doesn't go through load_merged_config).
probe_action_labels:
  # m04d 13-D RAFT features × 4-mag × 4-dir = 16 possible · 8 surviving after
  # the 34-clip filter on the FULL pool. Drives target_per_class for the POC
  # stratified subsampler (utils.eval_subset.stratified_by_motion_class_subset).
  n_motion_classes: 8
  # iter16 M9 (2026-05-21): eval_subset_in DELETED. Master manifest path now
  # derived from data.local_data_dir + data.master_manifest_name above via
  # utils.config.get_master_manifest_path().
  # iter16 M1 Option X (2026-05-21): subsample_manifest_for_mode() applies
  # per-mode mechanism (sorted[:N] for SANITY, stratified_by_motion_class for
  # POC, identity for FULL) on top of the master manifest.
  min_clips_per_class:
    sanity: 5                   # 600 / 16 ≈ 37 → relaxed for code-correctness only
    poc:    100                 # iter17 (2026-05-26): 34→100. probe_split's val fraction is small,
    full:   100                 # so a ≥5-per-val-class floor needs
                                # ~5/0.05=100 clips/class. At 34, eval_10k's under-sampled
                                # classes (medium__rightward 58cl/38vid, slow__leftward 86cl)
                                # passed the filter but failed the video-disjoint val≥5 split.
                                # 100 drops them at the natural gap (next class = 189 clips).
  min_per_split:
    sanity: 1                   # min clips per stratified train/val/test split
    poc:    5
    full:   5

# -- Probe-trio defaults (probe_action / probe_taxonomy / probe_motion_cos /
# probe_future_mse / probe_future_regress). argparse uses these as fall-through
# defaults via `default=None`; explicit CLI flag overrides for ablation sweeps.
probe:
  seed:                99            # was src/probe_*.py:--seed default
  num_frames:          16            # was src/probe_{action,taxonomy,motion_cos,future_*}.py NUM_FRAMES_DEFAULT
  pool_tokens:         16            # was src/probe_{action,taxonomy,motion_cos}.py:--pool-tokens default
  epochs:              50            # was src/probe_{action,taxonomy}.py:--epochs default
  lr:                  5.0e-4        # was src/probe_{action,taxonomy}.py:--probe-lr default
  wd:                  0.05          # was src/probe_{action,taxonomy}.py:--probe-wd default
  warmup_pct:          0.10          # was src/probe_{action,taxonomy}.py:--warmup-pct default
  depth:               4             # was src/probe_{action,taxonomy}.py:--probe-depth default (linear MLP depth)
  batch_size:          64            # was src/probe_{action,taxonomy}.py:--train-batch-size default
  # iter18 (2026-06-20): DELETED the stale scalar min_clips_per_class:34 / min_per_split:5 — they
  # CONFLICTED with the canonical mode-keyed probe_action_labels.{min_clips_per_class,min_per_split}
  # (poc/full 100/5, sanity 5/1). m04e + action_labels now single-source from probe_action_labels[mode].
  eval_frame_cache:                  # iter17: decode each eval clip ONCE, shared across the 8 concurrent
                                     # per-encoder eval processes (memoized inside decode_video_bytes). Was
                                     # ~7 decodes/encoder × 8 encoders → CPU pinned (load 467/256), GPUs idle.
    enabled:           true          # run_eval.sh sets EVAL_FRAME_CACHE_DIR when true; OFF for training/data-prep
    subdir:            "m12_frame_cache"  # cache dir under LOCAL_DATA (durable, gitignored). iter18: ALSO used by
                                     # build_probe_clips' decode workers — the 451 probe clips are identical across
                                     # all 13 arms (same val split, same nf=16) → arm 1 decodes, arms 2-13 + evals HIT
    min_free_gb:       80            # stop writing NEW cache entries when free disk < this. clips decode at
                                     # native ~360x640 → nf16 ≈ 11 MB/clip (full 9130-clip universe ≈ 100 GB);
                                     # 80 GB floor self-bounds nf64/pace growth + leaves room for eval transients
  future_regress:                    # probe_future_regress.py: future-frame regressor MLP
    epochs:            50            # was REGRESSOR_EPOCHS module constant
    batch_size:        64            # was REGRESSOR_BATCH
    lr:                1.0e-3        # was REGRESSOR_LR
    wd:                0.05          # was REGRESSOR_WD
    mlp_hidden:        4096          # was REGRESSOR_MLP_HIDDEN
  predictor_temporal:                # m12e_predictor_temporal.py (Stages 8b/9b) — iter16 §3.3/§3.4
    batch_size:        4             # EMPIRICAL: BS 4→32 gave ~0× (2.9→3.28 s/clip, 12% SLOWER) — m12e is compute-bound at 98% util (per-clip sequential predictor rollout), NOT batch-starved; low VRAM was a red herring. Reverted to 4. m12e _safe_metric OOM-backoff.
    deltas:            [1, 2, 4, 8]  # §3.4: was pt_tdist._DELTAS — Δt target-offset sweep (frames)
    mask_ratios:       [0.3, 0.5, 0.7, 0.9]  # §3.4: was pt_maskratio._RATIOS — masked-token fraction
    seed:              0             # §3.4: was pt_maskratio._SEED / pt_order._SEED (det. partition)
  encoder_temporal:                  # m12f_encoder_temporal.py (Stages 8c/9c) — iter18 revival + speedups #1-#8
    batch_size:        32            # §opt 4→32: fills idle VRAM; iter18 #4: OOM now HALVES the clip batch
                                     # (recursive sub-batch, m12e safe_metric pattern) instead of sys.exit
    tubelet_size:      2             # V-JEPA 2.1 ViT-G tubelet (matches configs/model/vjepa2_1.yaml)
    tov_n_permutations: 4            # TOV/VCOP: identity + 3 frame-shuffles
    pace_strides:      "1,2,4"       # Pace playback rates (sorted, distinct)
    pace_source_frames: 64           # oversample decode = num_frames(16) × max(strides)(4)
    tcc_temperature:   0.1           # TCC soft-NN temperature (Dwibedi eq.1)
    tcc_pair_chunk:    auto          # iter18 #8: pairs per batched-TCC chunk. 'auto' = derived at runtime
                                     # from free VRAM × gpu.gpu_memory_target (same universal cap as
                                     # AdaptiveBatchSizer) ÷ per-pair bytes (3·T_eff·D gathers + 2 T_eff²
                                     # maps, fp32, ×2 safety) → scales itself across 24/48/96 GB boxes.
                                     # An explicit int pins it (e.g. 4096 ≈ 1.7 GB at T_eff=8, D=6656).
    share_features:    1             # iter18 #6: serve the IDENTITY forward (AoT-fwd / TOV perm-0) from
                                     # probe_action's features_{split}.npy (m12b share pattern); m12f falls
                                     # back to fresh forwards WITH an explicit reason if the cache can't
                                     # serve every split key (never silent)
    head_lr:           1.0e-3        # tiny linear head (aot/tov/pace)
    head_epochs:       20
    head_weight_decay: 1.0e-4
    head_batch_size:   64
    head_train_cap:    2000          # §opt: cap head-fit TRAIN clips (linear head on D=6656 saturates
                                     # ~1.5-2k); TEST split + BCa CI UNTOUCHED. 6844→2000 ≈ 3.4× less train I/O.

# -- Bootstrap 95% CI (utils/bootstrap.py) --
bootstrap:
  n_iterations:        10000         # was N_BOOTSTRAP module constant
  ci_level:            0.95          # was CI_LEVEL module constant

# -- m10/m11 per-clip verify-plot curation (utils/curate_verify.py) --
curate_verify:
  agent_pct_sweet_min: 0.01          # was AGENT_PCT_SWEET_MIN: ≥1% pixels must be agent
  agent_pct_sweet_max: 0.15          # was AGENT_PCT_SWEET_MAX: ≤15% (avoid frame-dominating masks)
  top_n:               20            # was TOP_N: top-N verify clips per category
  pre_select_n:        100           # was PRE_SELECT_N: cap on per-clip verify plots written

# -- Data prep constants (m00 family + utils/config.py file-storage settings) --
data_prep:
  default_seed:        42            # was m00c.SEED + m00e/m00f --seed argparse defaults
  confidence_floor:    0.7           # was m00e/m00f CONFIDENCE_FLOOR module constant
  avg_clip_duration_sec: 7.85        # was m00b AVG_CLIP_DURATION (measured over 500 sampled clips × 168 videos)
  hf_repo_size_limit_gb: 300         # was utils/config.HF_REPO_SIZE_LIMIT_GB
  reencode_crf:        28            # was utils/config.REENCODE_CRF

