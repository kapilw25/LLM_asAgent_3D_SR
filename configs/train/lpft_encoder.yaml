# iter18 B4(b) baseline · LP-FT (Linear-Probing then Fine-Tuning) — Kumar et al. ICLR'22 (arXiv:2202.10054).
# Forked from surgery_3stage_DI_encoder.yaml 2026-06-03 (copy-first: cp m09c1 → m09f_naiveft_encoder.py).
#
# WHAT IT IS: m09f first WARMS the head only (lp_ft_stage0, encoder frozen) so the head is accurate,
# THEN fine-tunes all 48 blocks at a LOW encoder LR (≪ the head-warmup LR) so the already-good head does
# not distort the pretrained features. RAW clips, no factor curriculum. The Kumar contrast vs Full-FT
# (Full Fine-Tuning: no warmup, one LR) IS the story: LP-FT preserves temporal features better.
#
# USAGE (2B ViT-G = run_train's default BACKBONE = the BIGGEST):
#   POC/FULL:  BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh lpft_encoder --POC
#   SANITY:    REPLAY_OVERRIDE=off BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh lpft_encoder --SANITY

extends: surgery_base.yaml

data:
  adapted_encoder: vjepa_2_1_lpft_encoder          # unique per-arm
  output_dir: outputs/full/m09f_lpft_encoder       # auto-overridden by run_train.sh

interaction_mining:
  enabled: false

surgery:
  teacher_mode: EMA
  lp_ft_stage0:
    enabled: true                  # the LP (Linear-Probing) phase: head-only warmup, encoder frozen.
                                   # head warms at base_lr × head_lr_multiplier (10×, surgery_base) = HIGH
                                   # vs the encoder, so the head is accurate before the encoder unfreezes.
  # THEN the FT (Fine-Tuning) phase: unfreeze ALL 48 blocks (unfreeze_below 1.0) at the LOW base_lr below.
  stages:
    - name: lpft_full
      unfreeze_below: 1.0
      mode_mixture: {L: 1.0, A: 0.0, I: 0.0}
      max_epochs_pct: 1.00

optimization:
  lr: 1.0e-5                       # LOW encoder FT LR (real key = optimization.lr; base default 5.0e-5).
                                   # Kumar: encoder LR ≪ head-warmup LR (head = 10× via head_lr_multiplier).
                                   # Tunable for POC.
  spd:
    enabled: false
  loss:
    saliency_weighting: false

replay:
  raw_pretrain_pct: 1.0

# iter18 (2026-06-03): LP-FT OWNS drift-OFF explicitly — it was silently inheriting surgery_base's
# l2_uniform λ=0.005 anchor. The LP-then-FT ORDER (Kumar ICLR'22) is its anti-distortion mechanism,
# NOT an L2 anchor — so no drift term, declared like its spd-off / saliency-off.
drift_control:
  enabled: false
