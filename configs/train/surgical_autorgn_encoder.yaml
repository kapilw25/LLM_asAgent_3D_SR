# iter18 B2 baseline · Surgical Fine-Tuning — Auto-RGN (Automatic Relative Gradient Norm) block
# selection (Lee et al. ICLR'23; official repo anniesch/surgical-finetuning, main.py get_lr_weights).
# Forked from surgery_3stage_DI_encoder.yaml 2026-06-03.
#
# WHAT IT IS: surgery's SAME trainer (m09c1) + SAME EMA teacher + SAME masks/forward/export, but the
# trainable blocks are chosen by GRADIENT (RGN = ||grad|| / ||theta||, hard top-k) instead of surgery's
# structured 4/8/8 factor schedule — and on RAW clips (no factor curriculum). The must-beat namesake:
# surgery (structured factor blocks) > Auto-RGN (gradient-picked blocks), CI-separated, SAME budget.
#
# BUDGET-MATCH: k_blocks=8 = round(depth 48 * surgery's deepest unfreeze_below 0.167) → EXACTLY
# surgery's trainable-param count (the namesake comparison must be un-attackable on the budget).
#
# ADAPTATION NOTE: the OFFICIAL Auto-RGN is a SOFT per-tensor LR (lr proportional to RGN); we use a
# HARD top-k block freeze for the exact budget match. State this as an adaptation in the paper.
#
# USAGE (2B ViT-G = run_train's default BACKBONE = the BIGGEST):
#   POC/FULL:  BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh surgical_autorgn_encoder --POC
#   SANITY:    REPLAY_OVERRIDE=off BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh surgical_autorgn_encoder --SANITY
#              (REPLAY_OVERRIDE=off → raw_pretrain_pct 0 → FactorSampler code-smoke; avoids the
#               raw-replay-needs-streaming FATAL. POC/FULL use streaming + raw_replay 1.0 = all-RAW.)

extends: surgery_base.yaml

data:
  adapted_encoder: vjepa_2_1_surgical_autorgn_encoder      # unique per-arm (m05/m06 outputs don't collide)
  output_dir: outputs/full/m09c_surgical_autorgn_encoder   # auto-overridden by run_train.sh

# Auto-RGN trains on RAW clips (no factor curriculum) → no D_I interaction tubes needed.
interaction_mining:
  enabled: false

surgery:
  # iter18 B2: gradient block-selection (vs surgery's depth_fraction prefix). m09c1 scores RGN on
  # n_score_batches warmup batches, picks the top-k blocks ONCE, freezes the rest, then trains them.
  freeze_rule: auto_rgn
  auto_rgn:
    k_blocks: 8                    # budget-matched to surgery's deepest stage = round(48 * 0.167)
    n_score_batches: 5             # RGN averaged over 5 warmup batches (Lee'23 repo: islice(loader, 5))
  teacher_mode: EMA                # surgery minus the SALT/factor knobs: plain EMA teacher
  lp_ft_stage0:
    enabled: false                 # SINGLE trainable phase (no head warmup) — Auto-RGN picks ONCE
  # ONE stage. unfreeze_below is IGNORED under freeze_rule=auto_rgn (the gradient picks the k=8 blocks,
  # not the depth fraction); kept for schema parity. mode_mixture is moot under raw_replay 1.0 (all-raw);
  # for the SANITY FactorSampler code-smoke it picks layout (D_L) clips.
  stages:
    - name: autorgn_single
      unfreeze_below: 0.167
      mode_mixture: {L: 1.0, A: 0.0, I: 0.0}
      max_epochs_pct: 1.00

# Auto-RGN = surgery method on RAW: drop the curriculum knobs (no SPD, no saliency).
optimization:
  spd:
    enabled: false
  loss:
    saliency_weighting: false

replay:
  raw_pretrain_pct: 1.0            # ALL raw clips (no factor view) = "surgery method on RAW". POC/FULL
                                   # use streaming (raw_replay needs factor_streaming.enabled=true);
                                   # SANITY runs REPLAY_OVERRIDE=off → 0.0 → FactorSampler code-smoke.

# iter18 (2026-06-03): Auto-RGN OWNS drift-OFF explicitly — it was silently inheriting surgery_base's
# l2_uniform λ=0.005 anchor. Gradient block-SELECTION (Lee ICLR'23) is its mechanism; the picked top-k
# blocks train un-anchored — declared like its spd-off / saliency-off.
drift_control:
  enabled: false
