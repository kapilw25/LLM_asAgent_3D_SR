# Checkpoint download registry — SINGLE SOURCE for both:
#   · setup_env_uv.sh                              → --group trainable      (fast path; unblocks torch)
#   · src/utils/download_checkpoints.py --group …  → eval_baselines / all   (§G frozen-baseline ckpts,
#                                                     consumed downstream by run_eval.sh → m12*_*.py)
#
# TWO sections so group membership is editable WITHOUT touching URLs:
#   catalog: canonical filename → upstream URL.  STABLE — the name is what run_eval.sh frozen_ckpt_for +
#            configs/eval/probe_encoders.yaml expect; aria2c -o renames differently-named upstream assets.
#            Verified 2026-05-29: each URL HTTP 200 + remote Content-Length == on-disk bytes.
#   groups:  which catalog entries each consumer fetches.  ITER-SPECIFIC — edit freely as the trained set
#            changes. A filename may appear in MORE THAN ONE group (no URL duplication).

catalog:
  vjepa2_1_vitg_384.pt:           https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitg_384.pt
  vjepa2_0_vitg_384.pt:           https://dl.fbaipublicfiles.com/vjepa2/vitg-384.pt
  vjepa2_1_vitG_384.pt:           https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitG_384.pt
  vjepa2_1_vitl_dist_vitG_384.pt: https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitl_dist_vitG_384.pt
  vjepa2_0_vitl_256.pt:           https://dl.fbaipublicfiles.com/vjepa2/vitl.pt
  vjepa1_vitL_16.pt:              https://dl.fbaipublicfiles.com/jepa/vitl16/vitl16.pth.tar
  vjepa1_vitH_16.pt:              https://dl.fbaipublicfiles.com/jepa/vith16/vith16.pth.tar
  lejepa_l.pt:                    https://huggingface.co/datasets/gajeshladharai/artifacts/resolve/main/core-jepa/lejepa-l.pt

groups:
  # backbones we TRAIN (setup_env fast path). iter18 (2026-06-03): FT baselines train on the 2B ViT-G
  # champion — the BIGGEST available (surgery's best, 4/0/5) per the "always use the biggest model"
  # decision. The 1B vitg + 2.0 vitg (iter17 scale/version axis) are ALREADY in checkpoints/ locally, so
  # they are DROPPED from the download list → setup_env fetches ONLY the 2B (~16 GB). vjepa2_1_vitG_384.pt
  # also appears under eval_baselines (no URL duplication — the catalog above is the single filename→url source).
  trainable:
    - vjepa2_1_vitG_384.pt
    - vjepa2_1_vitg_384.pt        # 1B ViT-g — uncommented for the iter18 1B replication (runbook_v5);
                                  # fresh Box-B/C have no local copy, so setup_env must fetch it (~14 GB)

  # iter16 champion (2.1 ViT-G 2B) + image/version frozen baselines (~59 GB). NOT needed to train on the
  # iter17 node (§G carries their metrics via outputs/poc); fetch on demand to (re)eval the frozen row.
  eval_baselines:
    - vjepa2_1_vitG_384.pt
    - vjepa2_1_vitl_dist_vitG_384.pt
    - vjepa2_0_vitl_256.pt
    - vjepa1_vitL_16.pt
    - vjepa1_vitH_16.pt
    - lejepa_l.pt
