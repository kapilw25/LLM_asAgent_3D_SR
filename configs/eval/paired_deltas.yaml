# Paper paired-Δ hypothesis tests — single source of truth.
#
# Consumed by:
#   src/probe_action.py  run_paired_delta_stage()
#   src/utils/config.py  get_paired_deltas()
#
# Each entry computes Δ = a_acc − b_acc on the shared test-clip intersection
# with BCa 95% CI, and appears as one row under
# `<output_root>/probe_paired_delta.json["iter14_paper_deltas"][<key>]`.
#
# Schema (per entry):
#   key            — JSON output key (must be unique; used as identifier downstream)
#   a              — encoder name (must exist in configs/eval/probe_encoders.yaml)
#   b              — encoder name (Δ = a − b on shared test-clip intersection)
#   interpretation — human-readable hypothesis (shown in JSON + log output)
#
# Adding a new Δ: append a new list entry below.
# Removing a Δ: delete the entry (downstream plots auto-adapt).
# Renaming variants: edit configs/eval/probe_encoders.yaml — the names referenced
# here are validated against ENCODERS at load time (FAIL LOUD if mismatch).
#
# Background — iter14 (2026-05-08) introduced Δ1-Δ3 (encoder-update only).
# iter15 Phase 4 (2026-05-14) added Δ4-Δ7 to probe the head-only sibling
# variants. See iter/iter14_surgery_on_pretrain/plan_surgery_on_pretrain.md
# § Q3 and iter/iter15_trainHead_freezeEncoder/high_level_outputs.md.

paired_deltas:

  # iter14 encoder-update deltas ───────────────────────────────────────

  - key: delta_1_pretrain_vs_frozen
    a: vjepa_2_1_pretrain_encoder
    b: vjepa_2_1_frozen
    interpretation: "Δ1: pretrain > frozen (continual SSL beats frozen baseline)"

  - key: delta_2_surgical_vs_pretrain
    a: vjepa_2_1_surgical_3stage_DI_encoder
    b: vjepa_2_1_pretrain_encoder
    interpretation: "Δ2: surgery > pretrain (factor patching adds value)"

  - key: delta_3_surgical_vs_pretrain_2X
    a: vjepa_2_1_surgical_3stage_DI_encoder
    b: vjepa_2_1_pretrain_2X_encoder
    interpretation: "Δ3: surgery > pretrain_2X (CAUSAL — gain is factor patching, not extra steps)"

  # iter15 Phase 4 head-only deltas (encoder bit-identical to Meta init) ──

  - key: delta_4_pretrain_vs_pretrain_head
    a: vjepa_2_1_pretrain_encoder
    b: vjepa_2_1_pretrain_head
    interpretation: "Δ4: pretrain > pretrain_head (does encoder-update add value beyond a trained head?)"

  - key: delta_5_surgical_vs_surgical_head
    a: vjepa_2_1_surgical_3stage_DI_encoder
    b: vjepa_2_1_surgical_3stage_DI_head
    interpretation: "Δ5: surgery > surgery_head (KEY iter15 paper claim — if |Δ5|<0.01, head-only WINS)"

  - key: delta_6_surgical_head_vs_pretrain_head
    a: vjepa_2_1_surgical_3stage_DI_head
    b: vjepa_2_1_pretrain_head
    interpretation: "Δ6: surgery_head > pretrain_head (factor data helps even when encoder is frozen)"

  - key: delta_7_DI_head_vs_noDI_head
    a: vjepa_2_1_surgical_3stage_DI_head
    b: vjepa_2_1_surgical_noDI_head
    interpretation: "Δ7: 3stage_DI_head > noDI_head (D_I tubes carry signal beyond D_L+D_A)"
