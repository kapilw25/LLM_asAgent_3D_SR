# iter18 B1(b) baseline · PEFT DoRA (Weight-Decomposed Low-Rank Adaptation, Liu et al. 2024) — one-flag
# delta over LoRA: use_dora=true. Decomposes each weight into magnitude + direction; the direction gets the
# LoRA update. Forked from peft_lora_encoder.yaml 2026-06-03. NOT the paper novelty.
#
# USAGE (2B ViT-G):
#   POC/FULL:  BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh peft_dora_encoder --POC
#   SANITY:    REPLAY_OVERRIDE=off BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh peft_dora_encoder --SANITY

extends: peft_lora_encoder.yaml

data:
  adapted_encoder: vjepa_2_1_peft_dora_encoder         # unique per-arm
  output_dir: outputs/full/m09b_peft_dora_encoder      # auto-overridden by run_train.sh

peft:
  use_dora: true                       # DoRA (the ONLY delta vs peft_lora_encoder.yaml)
