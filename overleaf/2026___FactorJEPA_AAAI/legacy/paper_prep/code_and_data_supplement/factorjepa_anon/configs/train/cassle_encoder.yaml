# iter18 B3 baseline · CaSSLe (Self-Supervised Models are Continual Learners, Fini CVPR'22) — anti-
# forgetting via feature distillation to the FROZEN previous model. Forked from full_ft_encoder.yaml
# 2026-06-03 (copy-first: cp m09c1 → m09d_contssl_encoder.py; the regularizer rides utils.contssl).
#
# WHAT IT IS: m09d trains ALL 48 blocks on RAW clips (= full_ft) PLUS a trainable predictor g that
# distills the FROZEN teacher's pooled feature (g(student) → L1 → frozen-teacher, stop-grad). The
# distillation is the anti-forgetting mechanism (vs full_ft's naive forgetting). The must-beat:
# surgery (structured factor blocks) > CaSSLe (unstructured feature distillation), CI-separated.
#
# USAGE (2B ViT-G = run_train's default BACKBONE = the BIGGEST):
#   POC/FULL:  BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh cassle_encoder --POC
#   SANITY:    REPLAY_OVERRIDE=off BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh cassle_encoder --SANITY

extends: surgery_base.yaml

data:
  adapted_encoder: vjepa_2_1_cassle_encoder        # unique per-arm (m05/m06 outputs don't collide)
  output_dir: outputs/full/m09d_cassle_encoder     # auto-overridden by run_train.sh

# RAW clips (continual SSL on the new domain) → no D_I interaction tubes.
interaction_mining:
  enabled: false

# CaSSLe distills to the FROZEN teacher (= the previous/pretrained model). teacher_mode FROZEN is
# inherited from surgery_base → the SALT teacher IS that frozen previous model (double duty: JEPA
# target + distillation target). lp_ft_stage0 off (continual SSL has no head-warmup stage).
surgery:
  lp_ft_stage0:
    enabled: false
  stages:
    - name: cassle_single
      unfreeze_below: 1.0                           # all 48 blocks trainable
      mode_mixture: {L: 1.0, A: 0.0, I: 0.0}       # RAW (mixture moot under raw_replay 1.0)
      max_epochs_pct: 1.00

# CaSSLe is the anti-forgetting term → drop surgery's curriculum knobs (SPD + saliency) AND the
# uniform L2 drift (the distillation replaces it — no double anchor).
optimization:
  spd:
    enabled: false
  loss:
    saliency_weighting: false
drift_control:
  enabled: false

replay:
  raw_pretrain_pct: 1.0                             # ALL raw clips = the continual-SSL data

# iter18 B3 CaSSLe predictor g (Fini CVPR'22 BN-MLP: D→hidden→D). Consumed by m09d via utils.contssl.
# NOTE (tunable at POC): weight + hidden_dim are research-design defaults, not yet swept.
contssl:
  method: cassle
  cassle:
    hidden_dim: 2048
    weight: 1.0                                     # λ_cassle on the L1 distillation term
    head_lr_multiplier: 10.0                        # g is a fresh head → scale its LR (matches motion_aux)
