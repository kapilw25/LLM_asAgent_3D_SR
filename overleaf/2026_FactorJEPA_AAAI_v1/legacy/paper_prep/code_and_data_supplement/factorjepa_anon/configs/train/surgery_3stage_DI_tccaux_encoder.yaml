# iter18 (2026-06-13) — IMPROVEMENT ARM #4 (plan_outperform_FT.md Q2, lever #4).
# Goal: stop the TCC regression (TCC Kendall τ / cycle-back) by ENABLING the EXISTING temporal
# cycle-consistency loss (γ·TCC soft-NN cycle) already implemented in
# utils/training.compute_multitask_loss — Dwibedi et al. CVPR'19 (arXiv:1904.07846). REUSES tested
# infra (no new loss code): the forward path activates the multi-task loss when gamma_tcc > 0.
#
# ADDITIVE: extends OURS; the ONLY diff vs the OURS recipe is the loss weights below. RUNNABLE now.
extends: surgery_3stage_DI_encoder.yaml

data:
  adapted_encoder: vjepa_2_1_surgical_3stage_DI_tccaux_encoder
  output_dir: outputs/full/m09c_surgery_3stage_DI_tccaux_encoder      # auto-overridden by run_train.sh

# nested override MERGES into the inherited optimization.loss block (keeps alpha_jepa, tcc_enabled,
# tcc_temperature, saliency_weighting, …) — only these two keys change vs OURS.
optimization:
  loss:
    gamma_tcc: 0.1                  # γ — was 0.0 (TCC off); enable the TCC term (weight = motion_aux convention)
    tcc_scale: 0.0833               # ≈1/12 — balances raw TCC (~6.6) against JEPA (~0.5) before γ (errors_N_fixes #81)
