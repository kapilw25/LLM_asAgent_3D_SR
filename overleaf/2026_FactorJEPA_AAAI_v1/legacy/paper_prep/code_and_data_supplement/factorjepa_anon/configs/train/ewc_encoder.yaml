# iter18 B3 baseline · EWC (Elastic Weight Consolidation, Kirkpatrick PNAS'17) — anti-forgetting via a
# Fisher-weighted quadratic anchor to the pretrained init θ*. Forked from full_ft_encoder.yaml 2026-06-03
# (copy-first: cp m09c1 → m09d_contssl_encoder.py; the regularizer rides utils.contssl).
#
# WHAT IT IS: m09d trains ALL 48 blocks on RAW clips (= full_ft) PLUS L_ewc = λ Σ F_i (θ_i − θ*_i)².
# The diagonal Fisher F is estimated ONLINE from the first n_fisher_batches steps' JEPA grads (θ≈θ*),
# then anchors important weights to the pretrained init. The must-beat: surgery (structured factor
# blocks) > EWC (unstructured Fisher anchor), CI-separated.
#
# USAGE (2B ViT-G = run_train's default BACKBONE = the BIGGEST):
#   POC/FULL:  BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh ewc_encoder --POC
#   SANITY:    REPLAY_OVERRIDE=off BACKBONE=vjepa_2_1_vitG ./scripts/run_train.sh ewc_encoder --SANITY

extends: surgery_base.yaml

data:
  adapted_encoder: vjepa_2_1_ewc_encoder           # unique per-arm (m05/m06 outputs don't collide)
  output_dir: outputs/full/m09d_ewc_encoder        # auto-overridden by run_train.sh

interaction_mining:
  enabled: false

# EWC anchors weights to θ* (= the frozen previous model's weights). teacher_mode FROZEN (inherited
# from surgery_base) keeps the JEPA target = that same frozen previous model, consistent with the
# anchor. lp_ft_stage0 off (continual SSL has no head-warmup stage).
surgery:
  lp_ft_stage0:
    enabled: false
  stages:
    - name: ewc_single
      unfreeze_below: 1.0                           # all 48 blocks trainable
      mode_mixture: {L: 1.0, A: 0.0, I: 0.0}       # RAW
      max_epochs_pct: 1.00

# EWC's Fisher penalty IS the anchor → drop surgery's SPD + saliency AND the uniform L2 drift (the
# Fisher-weighted anchor replaces the uniform one — no double anchor).
optimization:
  spd:
    enabled: false
  loss:
    saliency_weighting: false
drift_control:
  enabled: false

replay:
  raw_pretrain_pct: 1.0

# iter18 B3 EWC penalty (Kirkpatrick PNAS'17). Consumed by m09d via utils.contssl.add_ewc_grads.
# NOTE (tunable at POC): λ + n_fisher_batches are research-design defaults. n_fisher_batches must stay
# below the POC step count or the penalty never fires (online Fisher accumulates first, anchors after).
contssl:
  method: ewc
  ewc:
    lambda: 1000.0                                  # λ on the Fisher anchor (Kirkpatrick uses large λ)
    n_fisher_batches: 10                            # online-Fisher window (steps near θ*); < POC steps
