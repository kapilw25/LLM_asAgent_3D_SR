# iter18 (2026-06-13) — IMPROVEMENT ARM #5 (plan_outperform_FT.md Q1/Q2, lever #5).
# Goal: object-level intervention (Causal-JEPA, arXiv:2602.11389), adapted to PATCH-based V-JEPA by
# ADDING one object-sized FULL-TEMPORAL-EXTENT tube mask to the V-JEPA mask set. Over the agent-factor
# (D_A) / interaction (D_I) surgery clips the tube lands on agent regions → the model must predict an
# object's WHOLE TRAJECTORY from the surrounding context + interacting entities (the patch analog of
# Causal-JEPA's object-trajectory masking). REUSES the tested mask→student→predictor→JEPA-loss path —
# no new loss code; the existing forward loop simply gains a 3rd mask generator. RUNNABLE now.
#
# HONEST scope: the tube is placed RANDOMLY (object-SIZED, not slot-aligned — V-JEPA is patch-, not
# slot-based); object alignment comes from training on the agent-only D_A/D_I factor clips. The
# faithful slot-aligned version needs a slot encoder (out of scope). ADDITIVE: extends OURS.
extends: surgery_3stage_DI_encoder.yaml

data:
  adapted_encoder: vjepa_2_1_surgical_3stage_DI_intervene_encoder
  output_dir: outputs/full/m09c_surgery_3stage_DI_intervene_encoder   # auto-overridden by run_train.sh

# `mask` is a top-level LIST → an override REPLACES it, so re-specify the 2 V-JEPA blocks (unchanged)
# and ADD the object-trajectory tube. build_mask_generators builds one _MaskGenerator per entry.
mask:
  - spatial_scale: [0.15, 0.15]     # V-JEPA small blocks — unchanged
    temporal_scale: [1.0, 1.0]
    aspect_ratio: [0.75, 1.5]
    num_blocks: 8
  - spatial_scale: [0.7, 0.7]       # V-JEPA large blocks — unchanged
    temporal_scale: [1.0, 1.0]
    aspect_ratio: [0.75, 1.5]
    num_blocks: 2
  - spatial_scale: [0.30, 0.30]     # ⬅ NEW: ONE object-sized tube, full temporal extent (Causal-JEPA intervention)
    temporal_scale: [1.0, 1.0]      # mask the object's whole history → predict it from interactions
    aspect_ratio: [0.75, 1.33]
    num_blocks: 1
